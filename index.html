<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画像文字CAPTCHA デモ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>お問い合わせフォーム（デモ）</h1>
    <form id="demo-form">
      <label>お名前<input type="text" placeholder="山田 太郎"></label>
      <label>メッセージ<textarea rows="4" placeholder="ここに入力..."></textarea></label>

      <div class="captcha-widget" id="captcha">
        <div class="captcha-main">
          <div class="captcha-box" id="captcha-box" role="checkbox" aria-checked="false" tabindex="0">
            <div class="box-inner" id="box-inner"></div>
          </div>
          <span class="captcha-label" id="captcha-label">私はロボットではありません</span>
        </div>
        <div class="captcha-badge"><div class="badge-logo">🛡️</div><div class="badge-text"><strong>画像文字CAPTCHA</strong><span>プライバシー・利用規約</span></div></div>

        <div class="captcha-modal" id="captcha-modal" hidden>
          <div class="modal-inner" role="dialog" aria-modal="true" aria-labelledby="captcha-title">
            <p class="modal-title" id="captcha-title">画像に表示されている文字を入力してください</p>
            <img class="captcha-image" id="captcha-image" alt="読み取る文字が表示されたCAPTCHA画像">
            <div class="captcha-answer-row">
              <input id="captcha-answer" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="6" placeholder="6文字を入力" aria-label="CAPTCHAの答え">
              <button type="button" class="btn-refresh" id="btn-refresh" title="画像を更新">⟳</button>
            </div>
            <div class="modal-footer"><button type="button" class="btn-verify" id="btn-verify">確認</button></div>
            <p class="modal-msg" id="modal-msg" role="alert"></p>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btn-submit" disabled>送信</button>
      <p class="form-msg" id="form-msg" role="status"></p>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
